[tool:pytest]
testpaths =
    tests
    03_INVESTIGATIONS/PHYSICS/percolation/Q-P007/AUDIT_REPAIR_N001/TESTS
    03_INVESTIGATIONS/PHYSICS/percolation/AUDIT_REPAIR_N04_N05_N19_N21_N22_20260924/TESTS
    03_INVESTIGATIONS/MATHEMATICS/feigenbaum_constants/AUDIT_REPAIR_N003_FEIGENBAUM/tests
    03_INVESTIGATIONS/MATHEMATICS/prime_gaps/AUDIT_REPAIR_N06_N08/tests
    AUDIT/S9_PROVENANCE_20260924/TESTS
    03_INVESTIGATIONS/OTHER/rng_certification/AUDIT_REPAIR_N004_RNG_CALIBRATION/TESTS
    03_INVESTIGATIONS/OTHER/rng_certification/AUDIT_REPAIR_T03_RUNS_FORMULA/TESTS
    03_INVESTIGATIONS/PHYSICS/percolation/Q-P007/AUDIT_REPAIR_N001_CROSSOVER/TESTS
    03_INVESTIGATIONS/COMPUTATIONAL_SCIENCE/ai_consciousness_indicators
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# The Zenodo deposit ships reference copies of these test files. They are
# byte-copies of the originals for a reader's benefit and are NOT runnable
# standalone (they import from laboratory-relative paths that do not exist in
# the packaged form), so they must never be collected.
#
# Two locations, and both are needed:
#   zenodo/          the laboratory's own staging copy
#   zenodo-deposit/  the curated v1.0.0 deposit preserved at the repository root
#
# Omitting the second was a real defect, and it surfaced only on CI: the entry
# matched `zenodo` but not `zenodo-deposit`, so 4 collection errors appeared out
# of 33. The laboratory's own runs never saw it because the laboratory has no
# zenodo-deposit/ directory.
norecursedirs = .git __pycache__ .pytest_cache zenodo zenodo-deposit package node_modules build dist
addopts = -v
