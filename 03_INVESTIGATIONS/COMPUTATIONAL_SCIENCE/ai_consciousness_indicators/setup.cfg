[flake8]
max-line-length = 125
extend-exclude =
    .git,
    __pycache__,
    .pytest_cache,
    .venv,
    venv,
    build,
    dist,
    zenodo/package
# E203 is whitespace before ':' in a slice, which black's slice formatting
# produces by design and PEP 8 explicitly permits. Not a defect.
extend-ignore = E203
per-file-ignores =
    __init__.py: F401