[pytest]
# Root-level tests only. The generated Zenodo deposit under zenodo/package/
# holds byte-identical copies of these modules; collecting both produces
# duplicate-basename import errors that have nothing to do with the code under
# test. That failure mode already cost one debug cycle (F07), so it is excluded
# here at the config level rather than only in the clean-room script.
testpaths = test_battery.py test_perturbation.py test_standalone.py test_calibration_gate.py
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git __pycache__ .pytest_cache zenodo build dist .venv venv *.egg-info
addopts = -q