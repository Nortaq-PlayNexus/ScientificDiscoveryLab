name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Starts at 3.12, not 3.11, and that is deliberate. numpy 2.5 declares
        # Requires-Python >=3.12; there is no 2.5.x build for 3.11, so a 3.11 leg
        # cannot install the suite's own minimum dependency. The laboratory runs
        # on 3.14, which is in this matrix.
        python-version: ['3.12', '3.13', '3.14']
    steps:
      # fetch-depth 0 because tests/unit/test_manifest_repin.py verifies the
      # superseded manifest digests against git history. Under the default
      # shallow clone that check reports every path unverifiable, the test fails,
      # and the expected-failure gate correctly flags it as UNEXPECTED -- which is
      # what happened on run 37322128033. The integrity job needs the same
      # history; both were fixed together so the two cannot disagree again.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # requirements-ci.txt, NOT requirements.txt. The latter is the full
        # laboratory environment (RDKit, OpenMM, PySide6, torch) and most of it
        # is irrelevant to the tests, which import numpy, scipy, pytest and
        # mpmath. Installing torch per run costs minutes for nothing.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run test suite
        # Raw simulation data (.npz, .sqlite3 -- 377 MB, regenerable from the
        # seeds in each preregistration) is excluded from this repository. The
        # read-only audit tests read some of it and therefore fail CLOSED. That is
        # the control working as designed, not a packaging fault, so the suite is
        # EXPECTED to exit non-zero here.
        #
        # The previous version of this step grepped the FAILED/ERROR summary lines
        # for "historical evidence is missing". Those lines contain only the node
        # id, never the exception text, so the grep matched nothing: the gate
        # passed while all 20 real failures sat there unexamined. A gate that
        # cannot fail is worse than no gate, because it reads as a green light.
        #
        # This step now compares the observed failure set against the recorded one,
        # exactly. A failure not on the list fails the build; so does a listed test
        # that stopped failing, since that can mean the control stopped firing.
        run: |
          set +e
          python -m pytest -q > pytest_output.txt 2>&1
          code=$?
          echo "pytest exit: $code (non-zero expected: excluded data)"
          tail -2 pytest_output.txt
          set -e
          python tools/check_expected_failures.py pytest_output.txt

  integrity:
    name: publishable manifest verifies
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 is REQUIRED, not a preference. The superseded-digest check
      # recovers the pre-re-pin bytes from history to confirm the previously
      # published tree is still verifiable. actions/checkout defaults to a shallow
      # clone, so without this the check finds no commits, reports
      # "digest confirmed: 0", and exits 0 -- green having verified nothing.
      # That is the failure mode this repository already documents twice, so the
      # step now also refuses to pass on an empty check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify every shipped file against manifest.json
        run: python tools/verify_manifest.py

      # The manifest records a digest per shipped file, so editing any of them
      # fails the step above. The tempting remedy is to regenerate the manifest
      # until it is green, which is the same false fix as refreshing an immutable
      # baseline to silence a control (defect 3 of the self-audit).
      #
      # A re-pin is therefore allowed, but only through tools/repin_manifest.py,
      # which refuses to run without --acknowledge and records the superseded
      # digests in a hash-chained log. These three steps enforce that:
      #   1. the chain is internally consistent
      #   2. the superseded digests still match the bytes in git history, so the
      #      previously published tree remains verifiable
      #   3. the tools' own negative tests fire
      #
      # Each was written after the failure it guards against was observed here.
      - name: Re-pin chain is intact
        run: python tools/repin_manifest.py --verify-chain

      - name: Superseded digests still verify against git
        run: python tools/verify_superseded_digests.py

      - name: Re-pin guards fire (negative tests)
        run: |
          python tools/repin_manifest.py --selftest
          python tools/verify_superseded_digests.py --selftest

  deposit:
    name: curated deposit manifest verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The curated v1.0.0 deposit kept at zenodo-deposit/ has its own manifest.
      # It is verified too, so a future edit to either subtree is caught rather
      # than silently invalidating the other.
      - name: Verify the preserved curated deposit
        run: python tools/verify_deposit_manifest.py