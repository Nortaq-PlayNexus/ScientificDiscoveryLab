name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Starts at 3.12, not 3.11, and that is deliberate. numpy 2.5 declares
        # Requires-Python >=3.12; there is no 2.5.x build for 3.11, so a 3.11 leg
        # cannot install the suite's own minimum dependency. The laboratory runs
        # on 3.14, which is in this matrix.
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # requirements-ci.txt, NOT requirements.txt. The latter is the full
        # laboratory environment (RDKit, OpenMM, PySide6, torch) and most of it
        # is irrelevant to the tests, which import numpy, scipy, pytest and
        # mpmath. Installing torch per run costs minutes for nothing.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run test suite
        # Raw simulation data (.npz, .sqlite3 -- 377 MB, regenerable from the
        # seeds in each preregistration) is excluded from this repository. The
        # read-only audit tests read some of it and therefore fail CLOSED with
        # `required historical evidence is missing` or `unable to open database
        # file`. That is the control working as designed, not a packaging fault.
        #
        # So the suite is EXPECTED to exit non-zero here. The check below asserts
        # that every failure carries that specific cause and nothing else, which
        # is the meaningful assertion: a genuinely new failure will not match.
        run: |
          set +e
          python -m pytest -q > pytest_output.txt 2>&1
          code=$?
          echo "pytest exit: $code"
          tail -3 pytest_output.txt
          echo "--- failures not explained by excluded data ---"
          unaccounted=$(grep -E "^(FAILED|ERROR)" pytest_output.txt \
            | grep -vEi "historical evidence is missing|unable to open database file" || true)
          if [ -n "$unaccounted" ]; then
            echo "$unaccounted"
            echo "::error::a test failed for a reason other than excluded raw data"
            exit 1
          fi
          echo "(none) -- all failures accounted for"

  integrity:
    name: publishable manifest verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify every shipped file against manifest.json
        run: python tools/verify_manifest.py

  deposit:
    name: curated deposit manifest verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The curated v1.0.0 deposit kept at zenodo-deposit/ has its own manifest.
      # It is verified too, so a future edit to either subtree is caught rather
      # than silently invalidating the other.
      - name: Verify the preserved curated deposit
        run: python tools/verify_deposit_manifest.py